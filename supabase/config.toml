
[functions.verify-is-admin]
enabled = true
verify_jwt = true
import_map = "./functions/verify-is-admin/deno.json"
entrypoint = "./functions/verify-is-admin/index.ts"

[functions.handle-identity-token]
enabled = true
verify_jwt = false
import_map = "./functions/handle-identity-token/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/handle-identity-token/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/handle-identity-token/*.html" ]
